name: pipeline-cicd
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: "getting the code basement"
        uses: actions/checkout@v6
      - name: "DockerHub authentication"
        uses: docker/login-action@v4.2.0
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: "Docker Image Build"
        uses: docker/build-push-action@v7.2.0
        with:
          context: ./src
          file: ./src/Dockerfile
          push: true
          tags: |
            vznn/pipeline-cicd:v${{ github.run_number }}
            vznn/pipeline-cicd:latest
  cd:
    runs-on: ubuntu-latest
    needs: [ci]
    steps:
      - name: "getting the code basement"
        uses: actions/checkout@v6
      - name: "k8s context config"
        uses: azure/k8s-set-context@v5.0.0
        with:
          method: kubeconfig
          kubeconfig: ${{ secrets.KUBECONFIG}}
      - name: "deploy to k8s cluster"
        uses: Azure/k8s-deploy@v5
        with:
          namespace: "default"
          manifests: |
            ./k8s/deployment.yaml
          images: vznn/pipeline-cicd:v${{ github.run_number }}
